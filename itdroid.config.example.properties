# ITDroid run configuration.
#
# Copy this file to "itdroid.config.properties", edit the values, and run:
#   java -jar target/ITDroid-1.0.0.jar itdroid.config.properties
#
# This single file replaces the 8 positional command-line arguments. The values under
# "translation.*" also let you pick the translation engine (local Ollama, local llama.cpp,
# or a remote OpenAI-compatible endpoint with a token) without touching the .env file.
# Anything set here wins over .env and environment variables.

# Run parameters (required unless a default is noted).

# Path to the APK to internationalize. This exact file is reinstalled on the device at the
# very end, so the device is always left on the original app.
apkPath=../APKs/Original/app-debug.apk

# The app's real package name (check with: aapt dump badging <apk> | findstr package).
appPackage=com.example.dictoapp

# Folder that contains apktool.jar and uber-apk-signer.jar (default: extra).
extraFolder=extra

# Folder that contains settings.properties and the not-translatable strings.xml
# (default: . , the repo root already has both).
settingsDir=.

# Untranslatable strings tolerated before a language is considered not translated (default: 0).
alpha=0

# Folder where results and intermediate steps are written (default: output).
output=../APKs/Traducciones

# AVD name, or the serial of a connected physical device (Android 13+ / API 33+).
emulator=Test4

# Translation engine. Pick ONE; the other engines' keys are ignored.
#   ollama    local Ollama; set model and (optionally) autoStart to that same model so
#             ITDroid runs `ollama serve` + `ollama pull` for you.
#   llamacpp  local llama.cpp server; set endpoint to its port and either start it yourself
#             or put its launch command in autoStart.
#   api       remote OpenAI-compatible endpoint; set endpoint, model and your apiKey (bearer
#             token). Leave autoStart empty.
translation.engine=ollama

# Model name as known by the chosen engine (e.g. qwen2.5:3b, mistral:7b, gpt-4o-mini).
translation.model=qwen2.5:3b

# Chat-completions endpoint. Leave blank to use the engine's default
# (ollama :11434, llamacpp :8080). Required for engine=api.
translation.endpoint=

# Bearer token for engine=api (e.g. an OpenAI/OpenRouter key). Ollama ignores it.
# Leave empty for local engines. Keep real tokens OUT of version control.
translation.apiKey=

# How ITDroid should bring the server up (optional):
#   * an Ollama model name  starts `ollama serve` (if down) and `ollama pull`s it
#   * a launch command      e.g. "llama-server -m model.gguf --port 8080"
#   * empty                 the server must already be running (or is remote)
translation.autoStart=qwen2.5:3b

# Per-request timeout in seconds (raise for big batches on CPU; default 180).
translation.timeoutSeconds=180

# Sampling temperature (0 = most faithful; default 0).
translation.temperature=0
