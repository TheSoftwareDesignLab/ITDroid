# ITDroid run configuration.
#
# Copy this file to "itdroid.config.properties", edit the values, and run:
#   java -jar target/ITDroid-1.0.0.jar itdroid.config.properties
#
# This single file replaces the 8 positional command-line arguments. The values under
# "translation.*" also let you pick the translation engine (local Ollama, local llama.cpp,
# or a remote OpenAI-compatible endpoint with a token) without touching the .env file.
# Anything set here wins over .env and environment variables.

# Run parameters (required unless a default is noted).

# Path to the APK to internationalize. This exact file is reinstalled on the device at the
# very end, so the device is always left on the original app.
apkPath=../APKs/Original/app-debug.apk

# The app's real package name (check with: aapt dump badging <apk> | findstr package).
appPackage=com.example.dictoapp

# Folder that contains apktool.jar and uber-apk-signer.jar (default: extra).
extraFolder=extra

# Folder that contains settings.properties and the not-translatable strings.xml
# (default: . , the repo root already has both).
settingsDir=.

# Untranslatable strings tolerated before a language is considered not translated (default: 0).
alpha=0

# Root of all evaluations (default: results). Each app is written to <resultsDir>/<appPackage>, and
# "java -jar target/ITDroid-1.0.0.jar --report" serves this folder as a web report.
resultsDir=results

# Optional: an explicit output folder for this app (overrides resultsDir/<appPackage>).
#output=../APKs/Traducciones

# AVD name, or the serial of a connected physical device (Android 13+ / API 33+).
emulator=Test4

# Translation engine. Pick ONE; the other engines' keys are ignored.
#   ollama    local Ollama; set model and (optionally) autoStart to that same model so
#             ITDroid runs `ollama serve` + `ollama pull` for you.
#   llamacpp  local llama.cpp server; set endpoint to its port and either start it yourself
#             or put its launch command in autoStart.
#   api       remote OpenAI-compatible endpoint; set endpoint, model and your apiKey (bearer
#             token). Leave autoStart empty.
translation.engine=ollama

# Model name as known by the chosen engine (e.g. qwen2.5:3b, mistral:7b, gpt-4o-mini).
translation.model=qwen2.5:3b

# Chat-completions endpoint. Leave blank to use the engine's default
# (ollama :11434, llamacpp :8080). Required for engine=api.
translation.endpoint=

# Bearer token for engine=api (e.g. an OpenAI/OpenRouter key). Ollama ignores it.
# Leave empty for local engines. Keep real tokens OUT of version control.
translation.apiKey=

# How ITDroid should bring the server up (optional):
#   * an Ollama model name  starts `ollama serve` (if down) and `ollama pull`s it
#   * a launch command      e.g. "llama-server -m model.gguf --port 8080"
#   * empty                 the server must already be running (or is remote)
translation.autoStart=qwen2.5:3b

# Per-request timeout in seconds (raise for big batches on CPU; default 180).
translation.timeoutSeconds=180

# Sampling temperature (0 = most faithful; default 0).
translation.temperature=0

# Request style (default auto): json sends batches of 25 texts as a JSON object (general chat
# models); translategemma sends one text per request in the fixed prompt Google's TranslateGemma
# models expect; template sends one text per request using translation.promptTemplate (any
# translation-specialised model, e.g. Tencent Hy-MT2). auto picks translategemma or template by
# the model name ("translategemma", "hy-mt"), json otherwise.
translation.style=auto

# Prompt for style=template. {source} and {target} are language names, {text} the text; \n is a
# newline. Default: Hy-MT2's default-translation prompt.
#translation.promptTemplate=Translate the following text into {target}. Note that you should **only output the translated result without any additional explanation**:\n\n{text}

# Mask placeholders (%1$s, {count}, tags, entities) with <phN> tokens around single-text requests
# and restore them afterwards (default true for translategemma/template, false for json).
#translation.maskPlaceholders=true

# Reuse the translations stored in a previous strings_inventory.json of the output folder, so a
# re-run only asks the LLM for texts it has not seen (default true). Set false to retranslate all.
translation.reuseInventory=true

# Preflight. Before anything else ITDroid checks the device (API 33+, ABIs), the APK (native code,
# minSdk, launcher, not a TWA) and installs + launches the ORIGINAL app once to make sure it runs
# on this device. Set false to skip that launch test (default true).
preflight.launchTest=true

# Hardcoded strings. ITDroid finds the app's own code from the manifest and the BuildConfig class.
# Only for an app split in modules that neither mentions: extra package roots, comma separated
# (default empty), e.g. hardcoded.codePackages=org.vendor.editor,org.vendor.sync
hardcoded.codePackages=

# Exploration of the source language (the translated versions replay the same path).
# UI states captured per version (default 5) and clickables tapped per state (default 8).
exploration.maxStates=5
exploration.maxClickables=8

# Seconds to wait after each launch before the first capture, on top of the automatic
# "UI stopped changing" check: absorbs splash screens and first-run animations (default 3).
exploration.settleSeconds=3

# Ask the LLM for a realistic value for every text field found and type it before tapping, so
# screens behind forms become reachable; the same values are typed in every language (default false).
exploration.fillForms=false

# Also write graph.txt and graph.json next to every result.json: each state with all its nodes and
# every node-to-node relation. Only useful to debug the comparison by hand; they are large (several
# MB per language) and nothing else reads them (default false).
debug.graphDumps=false
