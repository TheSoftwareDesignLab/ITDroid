# ITDroid configuration, the only file a run reads. Edit it and run, from this folder:
#   java -jar target/ITDroid-1.0.0.jar
# A run needs apkPath. apkPath and emulator hold the values of this machine; every other key holds
# the value ITDroid also uses when the line is empty or missing.
# In a path write / or \\ (a single \ is lost when the file is read).

# ------------------------------------------------------------------ the app and the device

# The APK to evaluate. The device ends with this same APK installed.
apkPath=../APKs/Original/com.github.soundpod_33.apk

# Package of the app. Empty to take it from the APK; if it is written it must be that of the APK.
appPackage=

# AVD name (Test4) or serial of the device to use, Android 13 (API 33) or later. Empty for the only
# device connected (adb devices) or the one in the ANDROID_SERIAL environment variable; written here
# it wins over that variable.
emulator=Test6

# Folder of the results, one sub-folder per app. It is created if missing and it is the folder that
# "java -jar target/ITDroid-1.0.0.jar --report" shows.
resultsDir=results

# Folder with apktool.jar and uber-apk-signer.jar.
extraFolder=extra

# ------------------------------------------------------------------ languages

# Language the texts of the app are written in. Empty to ask the model.
sourceLanguage=en

# Languages to evaluate, comma separated, with the codes Android uses for its folders: es, ar, ru,
# fr, it, de, hi, ja, ko, bn, ms, zh-rCN... Each one adds a replay of the app (some minutes).
# A language the model does not handle (PLaMo Translate and pt) is skipped with the reason.
# it,fr,ru,ar,es,hi,pt
languages=ru

# Default strings a language may lack and still count as shipped by the app.
alpha=0

# ------------------------------------------------------------------ translation model

# ollama (local Ollama), llamacpp (local llama.cpp server) or api (remote OpenAI-compatible endpoint).
translation.engine=ollama

# Model as the engine knows it. A model of Hugging Face is written hf.co/<user>/<repository>:<file>.
# hy-mt2:1.8b-q8 (Hunyuan-MT) is the model in use. PLaMo Translate also works
# (hf.co/pfnet/plamo-3-translate-0.8b-GGUF:Q4_K_M, it needs Ollama 0.40 or later and has no pt).
translation.model=hy-mt2:1.8b-q8
# false starts nothing (the server must be running). true starts Ollama if it is down and downloads
# translation.model if it is missing. Anything else is a command run to start the server, such as
# llama-server -m model.gguf --port 8080.
translation.autoStart=false

# Chat-completions endpoint. Empty for the default of the engine (ollama :11434, llamacpp :8080).
# Required for api. With autoStart=true it is where the started Ollama is expected to answer.
translation.endpoint=

# Bearer token for api. It can also be given in the environment variable ITDROID_LLM_API_KEY, which
# keeps it out of this file.
translation.apiKey=

# Seconds per request and sampling temperature (0 is the most faithful).
translation.timeoutSeconds=180
translation.temperature=0

# How texts are sent: auto picks by the model name (plamo, translategemma, template for hy-mt, json
# for chat models).
translation.style=auto
# Prompt of the template style only, with {source}, {target} and {text}. Empty for the built-in one.
#translation.promptTemplate=
# Mask %1$s, {name} and tags around each request of the one-text styles (plamo, template,
# translategemma). The json style checks them in the answer instead.
#translation.maskPlaceholders=true
# What PLaMo is told about a text of up to three words, none turns it off. Only the plamo style uses it.
#translation.context=Text of a button, menu or label in the user interface of a mobile app.

# Names that are never translated (people, places, products), comma separated, written as the app
# writes them, such as Juan Pérez, New York. The name of the app, well-known brands, URLs, e-mails,
# package and class names, paths and figures with their units are protected by themselves.
translation.protectedTerms=

# Resource names of the app that are never translated, comma separated, on top of the Android ones
# ITDroid already knows (abc_action_bar_home_description...).
translation.keepResources=

# Reuse the translations of a previous run of the same app, so only new texts go to the model.
translation.reuseInventory=true

# ------------------------------------------------------------------ hardcoded strings

# Which literals of the code are translated. ui (where the text reaches the interface), ui+unknown
# (also where the scan cannot tell) or all (logs and data included).
hardcoded.translate=ui

# Move them to string resources, so the internationalized APK shows them translated. false leaves
# them in the source language.
hardcoded.extractCode=true

# Extra package roots of the app code, comma separated, for an app in modules the manifest does not name.
hardcoded.codePackages=

# A file of extra rules saying what a call does with a text, tried before the built-in ones
# (same format as hardcoded-consumers.txt in the sources). Empty for none.
hardcoded.extraRules=

# ------------------------------------------------------------------ exploration

# Install and start the original app once before anything else, to tell an app that does not run
# here from one the rebuild broke.
preflight.launchTest=true

# Screens captured and elements tapped per screen. 0 means no limit.
exploration.maxStates=5
exploration.maxClickables=8

# Minutes the exploration may take, 0 for no limit. Set it when maxStates is 0.
exploration.maxMinutes=0

# Extra seconds to wait after each start of the app before the first capture.
exploration.settleSeconds=3

# Ask the model for a value for each text field and type it, the same in every language.
exploration.fillForms=false

# Give the app every permission before each start. false lets the app ask and answers Allow, as a new
# user would, so the screens that explain a permission (notifications, location) are evaluated too.
exploration.grantPermissions=false

# A file of adb commands run after every clean start (push a file, send an intent). Empty for none.
exploration.setup=

# ------------------------------------------------------------------ comparison and output

# Share of the elements two screens must share to be compared, from 0 to 1.
comparison.minSimilarity=0.5

# Look at the screenshots for translated text drawn over a graphic that is not an element.
comparison.textOverGraphic=true

# Look at the screenshots for translated text cut inside a box that did not grow (an ellipsis, a
# word that does not show).
comparison.textCut=true

# For right-to-left languages, also evaluate the app with its layouts repaired.
rtl.repair=false

# Keep the APK built for each language in the results folder. false saves most of the disk.
output.keepLanguageApks=true
